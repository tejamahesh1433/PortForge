########################################################################
# PortForge PRODUCTION / default local stack (compose project: portforge).
#
# Default ports: API 58000, Dashboard 3000, PostgreSQL 55432.
#
# WARNING (v1.3+): Do NOT use `docker compose up --build` on this file for
# feature WIP. That previously replaced frozen production with development
# images. For v1.3 development use:
#
#   docker compose -p portforge-dev -f docker-compose.dev.yml --env-file .env.dev up -d
#
# See docs/development-isolation.md.
#
# Host ports default to deliberately uncommon values and remain overridable:
#
#   PORTFORGE_DB_HOST_PORT=55432 PORTFORGE_API_HOST_PORT=58000 docker compose up
########################################################################

services:
  portforge-postgres:
    image: postgres:16-alpine
    container_name: portforge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PORTFORGE_DB_NAME:-portforge}
      POSTGRES_USER: ${PORTFORGE_DB_USER:-portforge}
      POSTGRES_PASSWORD: ${PORTFORGE_DB_PASSWORD:-portforge}
    ports:
      - "${PORTFORGE_DB_BIND:-127.0.0.1}:${PORTFORGE_DB_HOST_PORT:-55432}:5432"
    volumes:
      - portforge-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PORTFORGE_DB_USER:-portforge} -d ${PORTFORGE_DB_NAME:-portforge}"]
      interval: 5s
      timeout: 5s
      retries: 10

  portforge-api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: portforge-api
    restart: unless-stopped
    environment:
      PORTFORGE_DB_HOST: portforge-postgres
      PORTFORGE_DB_HOST_PORT: 5432 # in-network port, not the published host port above
      PORTFORGE_DB_NAME: ${PORTFORGE_DB_NAME:-portforge}
      PORTFORGE_DB_USER: ${PORTFORGE_DB_USER:-portforge}
      PORTFORGE_DB_PASSWORD: ${PORTFORGE_DB_PASSWORD:-portforge}
      PORTFORGE_ADMIN_BOOTSTRAP_TOKEN: ${PORTFORGE_ADMIN_BOOTSTRAP_TOKEN:?set PORTFORGE_ADMIN_BOOTSTRAP_TOKEN before starting}
    ports:
      - "${PORTFORGE_API_BIND:-127.0.0.1}:${PORTFORGE_API_HOST_PORT:-58000}:8000"
    depends_on:
      portforge-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  portforge-dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: portforge-dashboard
    restart: unless-stopped
    environment:
      # This tells the dashboard where to find the API from the browser
      - NEXT_PUBLIC_PORTFORGE_API_URL=http://localhost:${PORTFORGE_API_HOST_PORT:-58000}
      - PORTFORGE_INTERNAL_API_URL=http://portforge-api:8000
      # Server-only: Add host + Remove record BFFs (never NEXT_PUBLIC)
      - PORTFORGE_ADMIN_BOOTSTRAP_TOKEN=${PORTFORGE_ADMIN_BOOTSTRAP_TOKEN:?set PORTFORGE_ADMIN_BOOTSTRAP_TOKEN before starting}
    ports:
      - "${PORTFORGE_DASHBOARD_BIND:-127.0.0.1}:${PORTFORGE_DASHBOARD_HOST_PORT:-3000}:3000"
    depends_on:
      portforge-api:
        condition: service_healthy

volumes:
  portforge-postgres-data:
