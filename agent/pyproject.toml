[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "portforge-agent"
version = "1.5.1"
license = { text = "Apache-2.0" }
description = "PortForge cross-platform local port discovery agent"
requires-python = ">=3.9"
dependencies = [
    "psutil>=5.9",
    "pyyaml>=6.0",
    "ruamel.yaml>=0.18",
]

[project.scripts]
portforge = "portforge_agent.cli:main"

[tool.setuptools.packages.find]
include = ["portforge_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
